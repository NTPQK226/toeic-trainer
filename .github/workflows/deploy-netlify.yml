name: Deploy to Netlify

# Deploy tự động mỗi khi push lên nhánh main (hoặc chạy tay từ tab Actions).
# KHÔNG dùng Netlify build pipeline → không tốn build minutes của Netlify.
# App là static thuần → workflow chỉ upload thẳng thư mục toeic_writing_app/ lên Netlify qua CLI.

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm nút "Run workflow" để deploy thủ công

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # App không có package.json/dependencies, nhưng netlify-cli cần chạy qua npx.
      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy \
            --dir=toeic_writing_app \
            --prod \
            --message "Deploy from GitHub Actions: ${{ github.sha }}"

      - name: Print deploy URL
        run: echo "✅ Deployed. Site: https://toeic-trainer.netlify.app"
