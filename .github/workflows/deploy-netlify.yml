name: Deploy to Netlify

# Automatic deploy on every push to main (or manual from Actions tab).
# Uses netlify-cli upload (no Netlify build minutes consumed - static site).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # Publish ONLY the app folder as the site root -> no PDFs/docs exposed,
        # site root = Part 1, /part2/ = Part 2.
        run: npx --yes netlify-cli@17 deploy --dir=toeic_writing_app --prod

      - name: Print result
        run: echo 'Deployed to https://toeictraining.netlify.app'
