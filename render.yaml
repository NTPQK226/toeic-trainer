# Render Blueprint - TOEIC Trainer (static site)
# Publish folder toeic_writing_app/ as site root:
#   /  -> Part 1, /part2/ -> Part 2, /part3/ -> Part 3

services:
  - type: web
    name: toeic-trainer
    runtime: static
    repo: https://github.com/NTPQK226/toeic-trainer
    branch: main
    staticPublishPath: ./toeic_writing_app
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
